name: SOUBEL One-Time Search Index Remediation

# One-time recovery trigger
on:
  push:
    branches:
      - security/remove-stale-pipeline-index-v1
    paths:
      - .github/workflows/remediate-stale-search-index.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: security/remove-stale-pipeline-index-v1

      - name: Remove stale redirect-only search record
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('assets/library-search-index.js')
          text = path.read_text(encoding='utf-8')
          prefix = 'window.SOUBEL_SEARCH_INDEX='
          if not text.startswith(prefix) or not text.rstrip().endswith(';'):
              raise SystemExit('Unexpected search-index format; refusing to modify.')

          records = json.loads(text[len(prefix):].strip()[:-1])
          stale = '/expertise/pipeline-asset-integrity/'
          live = '/knowledge-library/pipeline-asset-integrity/'

          stale_count = sum(r.get('url') == stale for r in records)
          live_count = sum(r.get('url') == live for r in records)
          if stale_count != 1:
              raise SystemExit(f'Expected exactly one stale record, found {stale_count}; refusing to modify.')
          if live_count != 1:
              raise SystemExit(f'Expected exactly one live Knowledge Library record, found {live_count}; refusing to modify.')

          cleaned = [r for r in records if r.get('url') != stale]
          urls = [r.get('url') for r in cleaned]
          if stale in urls:
              raise SystemExit('Stale record still present after cleanup.')
          if urls.count(live) != 1:
              raise SystemExit('Live Knowledge Library record was not preserved exactly once.')
          if len(urls) != len(set(urls)):
              raise SystemExit('Duplicate URLs detected after cleanup.')

          path.write_text(prefix + json.dumps(cleaned, ensure_ascii=False, separators=(',', ':')) + ';\n', encoding='utf-8')
          print(f'Records: {len(records)} -> {len(cleaned)}')
          print('Stale expertise record removed: yes')
          print('Live Knowledge Library record preserved: yes')
          PY

      - name: Commit cleaned index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library-search-index.js
          git diff --cached --quiet && { echo 'No change to commit.'; exit 1; }
          git commit -m "Remove stale pipeline integrity search record"
          git push origin HEAD:security/remove-stale-pipeline-index-v1
